spring:
  application:
    name: admin-service
  config:
    import: "optional:configserver:"
  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server
      fail-fast: false
    function:
      definition: aggregate
    stream:
      bindings:
        # A submitted grade, consumed by this service to aggregate team grades asynchronously.
        grades-out-0:
          destination: assay.grades
          producer:
            required-groups: admin-service
        aggregate-in-0:
          destination: assay.grades
          group: admin-service
          consumer: {max-attempts: 5, back-off-initial-interval: 500, back-off-multiplier: 2.0}
        notifications-out-0:
          destination: assay.notifications
          producer:
            required-groups: notification-service
        activity-out-0:
          destination: assay.activity
          producer:
            required-groups: notification-service
      rabbit:
        default:
          consumer:
            auto-bind-dlq: true   # each queue gets its own <queue>.dlq
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/admin-db}
    username: ${DATABASE_USERNAME:admin}
    password: ${DATABASE_PASSWORD:admin}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_SERVER_URL:http://localhost:7080/realms/assay}/protocol/openid-connect/certs

assay:
  demo:
    public-paths: /api/demo/personas
  security:
    public-paths: /api/demo/personas
  clients:
    evaluation: http://${EVALUATION_SERVICE_NAME:evaluation-service}
    rubric: http://${RUBRIC_SERVICE_NAME:rubric-service}
    notification: http://${NOTIFICATION_SERVICE_NAME:notification-service}

server:
  port: ${PORT:8080}
  shutdown: graceful

eureka:
  client:
    service-url:
      defaultZone: ${REGISTRY_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    description: "Assay admin service: teams, people, schedule, grades, release, demo copies"
    version: ${BUILD_VERSION:dev}
