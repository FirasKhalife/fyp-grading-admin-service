spring:
  application:
    name: admin-service
  config:
    # Shared settings from config-server (fyp-grading-config). Optional: this file is complete on its own.
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8071}/config"
  cloud:
    config:
      fail-fast: false
    stream:
      bindings:
        notifications-out-0:
          destination: assay.notifications
          producer:
            required-groups: notification-service
        activity-out-0:
          destination: assay.activity
          producer:
            required-groups: notification-service
      rabbit:
        default:
          # Each queue gets its own <queue>.dlq. Producers declare the queues too (required-groups), so they
          # must declare them with the same dead-letter arguments as the consumers.
          consumer:
            auto-bind-dlq: true
          producer:
            auto-bind-dlq: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/admin-db}
    username: ${DATABASE_USERNAME:admin}
    password: ${DATABASE_PASSWORD:admin}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    connection-timeout: 5s
    publisher-confirm-type: correlated   # a lost broker connection is reported, not silent
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_SERVER_URL:http://localhost:7080/realms/assay}/protocol/openid-connect/certs
          # Fetch the keys over the internal network, but only accept tokens whose issuer is the public URL Keycloak
          # puts in them (KC_HOSTNAME). Setting both means no discovery call: Boot only adds the issuer check.
          issuer-uri: ${AUTH_ISSUER_URI:http://localhost:7080/realms/assay}

assay:
  insights:
    # Plan 3.5: flag an assessment when its reviewers' scores are more than this many points apart.
    disagreement-threshold: 15
  demo:
    public-paths: /api/demo/personas
    max-copies: 2000   # review M7: above this, new visitors get 503 demo-capacity until the midnight purge
  security:
    public-paths: /api/demo/personas
  clients:
    evaluation: http://${EVALUATION_SERVICE_NAME:evaluation-service}
    rubric: http://${RUBRIC_SERVICE_NAME:rubric-service}
    notification: http://${NOTIFICATION_SERVICE_NAME:notification-service}

server:
  port: ${PORT:8080}
  shutdown: graceful
  tomcat:
    threads:
      max: 40   # review H5: a demo needs few threads, and each costs stack memory

eureka:
  client:
    # Register and refresh quickly: the services start together and find each other (and the config server) by name.
    initial-instance-info-replication-interval-seconds: 2
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: ${REGISTRY_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    description: "Assay admin service: teams, people, schedule, grades, release, demo copies"
    version: ${BUILD_VERSION:dev}

springdoc:
  # Service-to-service endpoints aren't part of the public API (the gateway doesn't route them).
  paths-to-exclude: /internal/**
